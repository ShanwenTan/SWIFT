# Architecture
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3


# Inference
data_path: /prompts/interactive_example.jsonl
output_folder: videos/interactive_45s_6prompt
inference_iter: -1
num_output_frames: 180
use_ema: false
seed: 1
num_samples: 1
save_with_index: true
switch_frame_indices: 30, 60, 90, 120, 150
global_sink: true
context_noise: 0

generator_ckpt: /models/longlive_models/models/longlive_base.pt
lora_ckpt: /models/longlive_models/models/lora.pt

adapter:
  type: "lora"
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: "bfloat16"
  verbose: false

# Prompt-phase adaptive window + segment anchors
adaptive_prompt_window_enabled: true
adaptive_prompt_window_min_size: 7
adaptive_prompt_window_tau_post: 18
adaptive_prompt_window_tau_pre: 9
segment_anchor_enabled: true
segment_anchor_recent_frames: 6
segment_anchor_max_segments: 4
segment_anchor_semantic_mix: 0.35
segment_anchor_scale: 0.8
